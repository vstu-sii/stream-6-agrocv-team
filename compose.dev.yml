name: agrocv-dev

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: agrocv-api:dev
    env_file:
      - path: .env
        required: false
    environment:
      APP_STAGE: dev
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MODEL_BASE_URL: http://stub-gateway:8080
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      stub-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  stub-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: agrocv-stub-gateway:dev
    command: ["uvicorn", "app.stub_gateway:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      APP_STAGE: dev
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${STUB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz').status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
