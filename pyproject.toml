[project]
name = "agrocv-api"
version = "0.1.0"
description = "AgroCV — сервис диагностики болезней растений по фото"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.format]
quote-style = "double"
